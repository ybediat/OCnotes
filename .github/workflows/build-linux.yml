name: Build Android on Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 platforms;android-26 build-tools;35.0.0 ndk;27.3.13750724'
          accept-android-sdk-licenses: true

      - name: Build from sources
        env:
          OPENNOTE_GRADLE_BIN: gradle
        run: bash scripts/build-android-linux.sh

      - name: Upload unsigned release
        uses: actions/upload-artifact@v7
        with:
          name: opennote-linux-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/libs/opennote.aar
            android/app/build/reports/lint-results-release.*
          if-no-files-found: error
          retention-days: 14