name: Build Android on Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # Contrôles rapides du cœur Go, sans Android : ils rendent la main en
  # quelques dizaines de secondes là où le build complet prend plusieurs
  # minutes. `go vet` et `gofmt` sont les « à passer avant de conclure » de
  # CLAUDE.md ; ils n'étaient jusqu'ici vérifiés qu'à la main.
  verifs-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          mal_formates="$(gofmt -l .)"
          if [ -n "$mal_formates" ]; then
            echo "Fichiers mal formatés (lancer 'gofmt -w') :"
            echo "$mal_formates"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      # Le wrapper Gradle est le seul binaire versionné du dépôt. Le comparer
      # au registre officiel des distributions Gradle à chaque exécution est ce
      # qui rend ce choix défendable : un relecteur — F-Droid en particulier —
      # n'a pas à croire le dépôt sur parole.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 platforms;android-26 build-tools;35.0.0 ndk;27.3.13750724'
          accept-android-sdk-licenses: true

      # F-Droid construit dans /home/vagrant/build/eu.ocnotes. gomobile grave
      # le chemin absolu du module dans les infos de build de libgojni.so, et
      # -trimpath ne l'efface pas : on construit donc depuis le même dossier,
      # sans quoi l'APK ne peut pas être reproduit octet pour octet.
      - name: Copy sources to the F-Droid build path
        run: |
          sudo mkdir -p /home/vagrant/build
          sudo chown "$USER" /home/vagrant/build
          cp -a "$GITHUB_WORKSPACE" /home/vagrant/build/eu.ocnotes

      - name: Build from sources
        env:
          OCNOTES_GRADLE_BIN: gradle
        working-directory: /home/vagrant/build/eu.ocnotes
        run: bash scripts/build-android-linux.sh

      - name: Upload unsigned release
        uses: actions/upload-artifact@v7
        with:
          name: ocnotes-linux-${{ github.sha }}
          path: |
            /home/vagrant/build/eu.ocnotes/android/app/build/outputs/apk/release/app-release-unsigned.apk
            /home/vagrant/build/eu.ocnotes/android/app/libs/ocnotes.aar
            /home/vagrant/build/eu.ocnotes/android/app/build/reports/lint-results-release.*
            /home/vagrant/build/eu.ocnotes/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          # Une trace d'une version obfusquée n'est exploitable qu'avec le
          # mapping exact de son build. GitHub limite cette conservation à 90 j.
          retention-days: 90
