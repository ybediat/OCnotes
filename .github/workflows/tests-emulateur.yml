name: Tests sur émulateur

# Tests de bout en bout sur un émulateur Android : saisie dans l'éditeur, et
# sauvegarde puis restauration d'un profil local (scripts/e2e-emulateur.sh).
#
# Seulement à la demande (onglet Actions, « Run workflow ») : un émulateur
# ajoute une dizaine de minutes, inutile à chaque PR. À lancer après une
# modification de l'éditeur ou de la sauvegarde, et avant une release.

on:
  workflow_dispatch:
  # TEMPORAIRE : mise au point sur la branche, à retirer avant fusion.
  push:
    branches: [claude/tests-emulateur]

permissions:
  contents: read

jobs:
  emulateur:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 platforms;android-26 build-tools;35.0.0 ndk;27.3.13750724'
          accept-android-sdk-licenses: true

      # APK debug + APK de test seulement : pas de release, pas de lint.
      - name: Build debug et tests
        env:
          OCNOTES_GRADLE_BIN: gradle
        run: bash scripts/build-android-linux.sh assembleDebug assembleDebugAndroidTest

      # Accélération matérielle de l'émulateur sur les machines Linux de GitHub.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 30 : la frappe et la barre de mise en forme s'y comportent comme
      # sur un téléphone (en API 34, le clavier de l'émulateur s'interpose).
      - name: Tests sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          # Écran de téléphone courant (le profil par défaut fait 320×640).
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/e2e-emulateur.sh

      - name: Journal de l'émulateur
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-emulateur-${{ github.sha }}
          path: build-e2e/
          if-no-files-found: ignore
          retention-days: 14
