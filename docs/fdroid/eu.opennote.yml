# Recette F-Droid proposée pour OpenNote.
#
# Ce fichier n'est pas lu depuis ce dépôt : sa place est dans `fdroiddata`,
# sous `metadata/eu.opennote.yml`. Il est versionné ici pour être joint à la
# demande d'inclusion (RFP) et pour rester en phase avec le dépôt — une recette
# écrite une fois puis oubliée diverge à la première release.
#
# Avant envoi : deux valeurs à remplir, marquées À REMPLIR, et une décision à
# prendre — le mode de signature, dont le bloc commenté plus bas donne les
# conséquences. Voir docs/fdroid/README.md.

Categories:
  - Writing
  - Internet
License: MIT
AuthorName: Yannis Bediat
SourceCode: https://github.com/ybediat/OpenNote
IssueTracker: https://github.com/ybediat/OpenNote/issues
Changelog: https://github.com/ybediat/OpenNote/releases

# `Summary` et `Description` ne sont pas répétés ici : F-Droid les lit dans
# `fastlane/metadata/android/<locale>/` du dépôt source, qui porte déjà le
# titre, les descriptions, les journaux de version nommés par versionCode,
# l'icône 512×512 et les captures.

RepoType: git
Repo: https://github.com/ybediat/OpenNote.git

Builds:
  - versionName: 0.1.2
    versionCode: 3
    commit: V0.1.2
    subdir: android/app
    gradle:
      - yes

    # Révision r27d. À vérifier contre la liste des NDK connus de
    # fdroidserver : si elle n'y figure pas, n'importe quelle r27 convient. Le
    # module accepte `-Popennote.ndkVersion=<révision>` et le script Linux ne
    # compare que des minima, précisément pour que cette ligne n'ait pas
    # besoin d'être exacte.
    ndk: r27d

    # Le cœur métier est en Go, lié par `gomobile bind`. La chaîne Go n'est pas
    # dans l'image de build : on l'installe à la révision exacte de go.mod,
    # checksum vérifié.
    sudo:
      - apt-get update
      - apt-get install -y curl
      - curl -fsSL -o /tmp/go.tar.gz https://go.dev/dl/go1.26.0.linux-amd64.tar.gz
      - echo 'À REMPLIR_SHA256  /tmp/go.tar.gz' | sha256sum -c -
      - rm -rf /usr/local/go
      - tar -C /usr/local -xzf /tmp/go.tar.gz
      - rm /tmp/go.tar.gz

    # Les lignes sont enchaînées par `&&` : `cd` et `export` tiennent jusqu'au
    # bout. `git rev-parse` évite de supposer si prebuild démarre à la racine du
    # dépôt ou dans `subdir`.
    #
    # GOPATH reste à son défaut, $HOME/go, donc hors de l'arbre de build : les
    # exécutables gomobile et gobind n'y sont jamais vus par le scanner.
    prebuild:
      - cd $(git rev-parse --show-toplevel)
      - export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
      - export ANDROID_NDK_HOME=$$NDK$$
      - export GOFLAGS=-mod=readonly
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
      - go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
      - gomobile init
      - mkdir -p android/app/libs
      - gomobile bind -target=android/arm64,android/amd64 -androidapi 26 -trimpath -ldflags='-s -w' -o android/app/libs/opennote.aar ./mobile

    # `gomobile bind` produit cet AAR *avant* Gradle. Le scanner de sources
    # rejette tout binaire trouvé dans l'arbre de build : sans cette ligne, le
    # build s'arrête sur « Found binary » alors que le fichier vient d'être
    # construit depuis les sources du dépôt, sous nos yeux.
    scanignore:
      - android/app/libs/opennote.aar

# ---------------------------------------------------------------------------
# Mode de signature : à trancher AVANT d'envoyer la RFP. Ce choix ne se reprend
# pas sans casse pour les utilisateurs.
#
# En l'état, cette recette est en **mode 1** : F-Droid construit et signe avec
# sa propre clé. C'est le mode par défaut, et de loin le plus simple à faire
# accepter pour une première inclusion.
#
# `docs/SIGNING.md` vise le **mode 2** : F-Droid reconstruit, vérifie que son
# APK est identique au binaire officiel hors signature, puis publie celui signé
# par OpenNote. C'est ce qui permet de passer d'un APK F-Droid à un APK
# téléchargé directement — ou suivi par Obtainium — sans désinstaller.
#
# Deux raisons de ne pas le mettre tout de suite : le mode 2 exige un build
# *reproductible*, ce qui n'est pas encore démontré ici ; et un échec de
# reproductibilité bloque la publication au lieu de la dégrader.
#
# Mais l'inverse coûte aussi : passer du mode 1 au mode 2 plus tard oblige les
# utilisateurs venus de F-Droid à désinstaller, les deux signatures étant
# incompatibles. La porte est à sens unique dans les deux sens — d'où le choix
# à faire maintenant, en connaissance de cause.
#
# Pour le mode 2, décommenter les deux lignes et publier l'APK signé à l'URL
# indiquée. L'empreinte est celle du certificat de production, relevée dans
# docs/SIGNING.md.
#
# Binaries: https://github.com/ybediat/OpenNote/releases/download/V%v/OpenNote-%v.apk
# AllowedAPKSigningKeys: 9eda46c9fdb2756cdad00a548c27261d1a5bfb25b06e11892071bbd19f35e6ec
# ---------------------------------------------------------------------------

AutoUpdateMode: Version V%v
UpdateCheckMode: Tags ^V[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.1.2
CurrentVersionCode: 3
