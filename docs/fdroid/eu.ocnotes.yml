# Recette F-Droid d'OCnotes, copie de metadata/eu.ocnotes.yml dans fdroiddata
# (MR https://gitlab.com/fdroid/fdroiddata/-/merge_requests/53459).
# Garder les options de gomobile bind identiques à scripts/build-android-linux.sh :
# c'est la condition pour que F-Droid reproduise l'APK signé.

Categories:
  - Internet
  - Writing
License: MIT
AuthorName: Yannis Bediat
SourceCode: https://github.com/ybediat/OCnotes
IssueTracker: https://github.com/ybediat/OCnotes/issues
Changelog: https://github.com/ybediat/OCnotes/releases

AutoName: OCnotes

RepoType: git
Repo: https://github.com/ybediat/OCnotes.git
Binaries: https://github.com/ybediat/OCnotes/releases/download/v%v/OCnotes-%v.apk

Builds:
  - versionName: 0.2.2
    versionCode: 10
    commit: HASH_COMPLET_DU_COMMIT_TAGUE_v0.2.2
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y curl
      - curl -fsSL -o /tmp/go.tar.gz https://go.dev/dl/go1.26.0.linux-amd64.tar.gz
      - echo 'aac1b08a0fb0c4e0a7c1555beb7b59180b05dfc5a3d62e40e9de90cd42f88235  /tmp/go.tar.gz'
        | sha256sum -c -
      - rm -rf /usr/local/go
      - tar -C /usr/local -xzf /tmp/go.tar.gz
      - rm /tmp/go.tar.gz
    gradle:
      - yes
    prebuild:
      - cd $(git rev-parse --show-toplevel)
      - export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
      - export ANDROID_NDK_HOME=$$NDK$$
      - export GOFLAGS=-mod=readonly
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
      - go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
      - gomobile init
      - sdkmanager 'platforms;android-26' 'platforms;android-35' 'build-tools;34.0.0'
      - mkdir -p android/app/libs
      - gomobile bind -target=android/arm64,android/amd64 -androidapi 26 -trimpath
        -ldflags='-s -w -buildid= -B none' -o android/app/libs/ocnotes.aar ./mobile
      - rm -f android/app/libs/ocnotes-sources.jar
    scanignore:
      - android/app/libs/ocnotes.aar
    ndk: r27d

AllowedAPKSigningKeys: b81ebfae3753d5b8fdb703cc0f5177d20bde66a57297f63759d40e771dca9ca4

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.2.2
CurrentVersionCode: 10
