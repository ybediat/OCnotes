# Recette F-Droid proposée pour OCnotes.
#
# Ce fichier n'est pas lu depuis ce dépôt : sa place est dans `fdroiddata`,
# sous `metadata/eu.ocnotes.yml`. Il est versionné ici pour être joint à la
# demande d'inclusion (RFP) et pour rester en phase avec le dépôt — une recette
# écrite une fois puis oubliée diverge à la première release.
#
# Avant envoi, il reste une chose à confirmer : que la révision de NDK demandée
# figure dans la liste connue de fdroidserver. Le mode de signature est tranché
# (mode 2) et le checksum de Go est renseigné. Voir docs/fdroid/README.md.

Categories:
  - Writing
  - Internet
License: MIT
AuthorName: Yannis Bediat
SourceCode: https://github.com/ybediat/OCnotes
IssueTracker: https://github.com/ybediat/OCnotes/issues
Changelog: https://github.com/ybediat/OCnotes/releases

# `Summary` et `Description` ne sont pas répétés ici : F-Droid les lit dans
# `fastlane/metadata/android/<locale>/` du dépôt source, qui porte déjà le
# titre, les descriptions, les journaux de version nommés par versionCode,
# l'icône 512×512 et les captures.

RepoType: git
Repo: https://github.com/ybediat/OCnotes.git

Builds:
  - versionName: 0.1.2
    versionCode: 3
    commit: v0.1.2
    subdir: android/app
    gradle:
      - yes

    # Révision r27d. À vérifier contre la liste des NDK connus de
    # fdroidserver : si elle n'y figure pas, n'importe quelle r27 convient. Le
    # module accepte `-Pocnotes.ndkVersion=<révision>` et le script Linux ne
    # compare que des minima, précisément pour que cette ligne n'ait pas
    # besoin d'être exacte.
    ndk: r27d

    # Le cœur métier est en Go, lié par `gomobile bind`. La chaîne Go n'est pas
    # dans l'image de build : on l'installe à la révision exacte de go.mod,
    # checksum vérifié.
    sudo:
      - apt-get update
      - apt-get install -y curl
      - curl -fsSL -o /tmp/go.tar.gz https://go.dev/dl/go1.26.0.linux-amd64.tar.gz
      - echo 'aac1b08a0fb0c4e0a7c1555beb7b59180b05dfc5a3d62e40e9de90cd42f88235  /tmp/go.tar.gz' | sha256sum -c -
      - rm -rf /usr/local/go
      - tar -C /usr/local -xzf /tmp/go.tar.gz
      - rm /tmp/go.tar.gz

    # Les lignes sont enchaînées par `&&` : `cd` et `export` tiennent jusqu'au
    # bout. `git rev-parse` évite de supposer si prebuild démarre à la racine du
    # dépôt ou dans `subdir`.
    #
    # GOPATH reste à son défaut, $HOME/go, donc hors de l'arbre de build : les
    # exécutables gomobile et gobind n'y sont jamais vus par le scanner.
    prebuild:
      - cd $(git rev-parse --show-toplevel)
      - export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
      - export ANDROID_NDK_HOME=$$NDK$$
      - export GOFLAGS=-mod=readonly
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
      - go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
      - gomobile init
      - mkdir -p android/app/libs
      - gomobile bind -target=android/arm64,android/amd64 -androidapi 26 -trimpath -ldflags='-s -w' -o android/app/libs/ocnotes.aar ./mobile

    # `gomobile bind` produit cet AAR *avant* Gradle. Le scanner de sources
    # rejette tout binaire trouvé dans l'arbre de build : sans cette ligne, le
    # build s'arrête sur « Found binary » alors que le fichier vient d'être
    # construit depuis les sources du dépôt, sous nos yeux.
    scanignore:
      - android/app/libs/ocnotes.aar

# ---------------------------------------------------------------------------
# Mode de signature : **mode 2, décidé**. F-Droid reconstruit l'application,
# vérifie que son APK est identique au binaire officiel hors signature, puis
# publie celui signé par OCnotes. Une seule signature pour tout le monde : un
# utilisateur passe d'une installation F-Droid à un téléchargement direct, ou à
# Obtainium, sans désinstaller.
#
# Ce que ce mode impose, et qui ne se négocie pas : le binaire publié à l'URL
# ci-dessous doit être **celui construit par la CI Linux**, jamais un build
# local. Mesuré le 4 septembre 2026 sur la 0.1.2 — le même commit donne
# 19 306 710 octets sous Windows et 18 187 434 sous Linux, et jusqu'au
# `libgojni.so` diffère (Go 1.27 local contre 1.26.0 en CI, entre autres).
# F-Droid construit sous Linux : un APK Windows ne peut pas correspondre.
#
# Le mode 2 échoue fermé : une non-correspondance ne dégrade pas la
# publication, elle l'empêche. C'est le prix de la signature unique.
# ---------------------------------------------------------------------------

Binaries: https://github.com/ybediat/OCnotes/releases/download/v%v/OCnotes-%v.apk
AllowedAPKSigningKeys: b81ebfae3753d5b8fdb703cc0f5177d20bde66a57297f63759d40e771dca9ca4

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.1.2
CurrentVersionCode: 3
